          <h2>من نحن</h2>
          <p>تعرض محمصة صليان الثمام بنًا مختصًا في أكياس واضحة البيانات: يُختار المحصول، ويُذكر أصله ومعالجته ودرجة تحميصه، ويُقترح أسلوب تحضيره في الكوب، حتى يعرف المشتري ماذا في الكيس قبل أن يطلب.</p>

        <section class="page" id="faq">
          <h2>الأسئلة الشائعة</h2>
          <details class="faq-item">
<summary>كم يستغرق تجهيز الطلب وشحنه؟</summary>
<p>يُجهَّز الطلب خلال أيام عمل بعد تأكيده. وتختلف مدة التوصيل بحسب المدينة وشركة الشحن، وقد تمتد في المواسم.</p>
</details>
          <details class="faq-item">
<summary>هل يصل البُن مطحونًا أم حبوبًا كاملة؟</summary>
<p>يُعرض البُن حبوبًا كاملة، ويمكن اختيار درجة الطحن عند الطلب إن أُتيح.</p>
</details>
          <details class="faq-item">
<summary>كيف يُعرف تاريخ التحميص؟</summary>
<p>يُذكر تاريخ التحميص أو نطاقه على الكيس أو في صفحة المنتج. وإذا أُعلن نطاق ووصل كيس أقدم منه، يُعالج ذلك بوصفه مخالفة للوصف.</p>
</details>
          <details class="faq-item">
<summary>ماذا أفعل إذا وصل الطلب تالفًا أو مختلفًا؟</summary>
<p>إذا ظهر ضرر على الشحنة يُستحسن تصويرها وإبلاغ الناقل عند الاستلام، ثم التواصل مع المتجر برقم الطلب وصور الكيس والملصق. والتصوير مستحسن وليس شرطًا لقبول المطالبة. ويُعالج التلف أو الخطأ أو النقص من غير أن يتحمل المستهلك تكلفة ذلك.</p>
</details>
          <details class="faq-item">
<summary>ما وسائل الدفع، وهل يمكن الاسترجاع؟</summary>
<p>تُعرض وسائل الدفع المعتمدة عند إتمام الطلب. وأحكام الاسترجاع مبيّنة في صفحتها، مع مراعاة طبيعة البُن بوصفه منتجًا غذائيًا.</p>
</details>

        <section class="page" id="privacy">
          <h2>سياسة الخصوصية</h2>
          <p>يُقتصر جمع البيانات على ما يلزم لتنفيذ الطلب، مثل الاسم ووسيلة التواصل وعنوان التوصيل.</p><p>تُشارك البيانات مع مزودي الدفع والتوصيل بالقدر اللازم لتنفيذ الطلب ووفق الضوابط النظامية. وتُحدَّد مدد الاحتفاظ وفق أغراض الجمع وما تقتضيه أنظمة المملكة، ثم تُحذف أو تُتلف بأمان.</p><p>ولصاحب البيانات —وفق النظام— الحق في العلم، والوصول إلى بياناته، والحصول على نسخة واضحة، وطلب التصحيح أو الإتمام أو التحديث، وطلب الإتلاف عند انتهاء الحاجة مع مراعاة الأحكام النظامية، والرجوع عن الموافقة حيث ينطبق. تُمارَس هذه الحقوق عبر نموذج الرسالة في صفحة «تواصل معنا».</p><p>التسويق المباشر اختياري وبموافقة مستقلة عن إتمام الطلب، ويمكن سحبها عبر النموذج نفسه.</p><p>وبحسب إرشاد مركز مساعدة سلة، تستقبل الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا) الشكاوى المتعلقة بنظام حماية البيانات الشخصية.</p>
        </section>
        <section class="page" id="returns">
          <h2>سياسة الاستبدال والاسترجاع</h2>
          <p>تُطبَّق هذه السياسة وفق نظام التجارة الإلكترونية ولائحته التنفيذية وممارسات المتجر، ولا تنتقص من حقوق المستهلك الإلزامية.</p><p>وفق المادة الثالثة عشرة من نظام التجارة الإلكترونية، للمستهلك —في غير الحالات المستثناة— فسخ العقد خلال الأيام السبعة التالية لتاريخ تسلّمه المنتج أو لتاريخ التعاقد على تقديم الخدمة، ما دام أنه لم يستخدم المنتج أو لم يستفد من الخدمة أو لم يحصل على منفعة من أيّ منهما. ويتحمل المستهلك تكاليف الفسخ إلا إذا اتفق أطراف العقد على غير ذلك.</p><p>وتُراعى استثناءات الفقرة (2) من المادة نفسها، واستثناءات المادة الحادية عشرة من اللائحة —ومنها المنتج المعرض للتلف خلال مدة جواز الفسخ، والمنتج الذي لا يمكن إعادة بيعه لأسباب صحية— بحسب طبيعة المنتج، من غير استبعاد شامل غير نظامي.</p><p>وللبُن يُفرَّق بين تغيير الرأي والعيب والخطأ: لا يُقبل عادةً إرجاع الكيس بعد فتحه أو فض ختمه لتغيير الرأي إن تعذر إعادة بيعه لأسباب صحية. أما طحن يخالف الاختيار، أو منتج يخالف الوصف —ومن ذلك كيس أقدم من نطاق التحميص المعلن— فلا يُعالج كاختلاف ذوق. واختلاف المذاق وحده لا يُعد عيبًا إذا طابق المنتج وصفه.</p><p>إذا وصل المنتج تالفًا أو مختلفًا أو ناقصًا يُعالج على نفقة المتجر بعد التحقق. والتصوير عند الاستلام مستحسن لا شرطًا للمطالبة. إعادة الشحن على المستهلك فقط لسبب مثبت راجع إليه وبتكلفة فعلية معلنة، لا لخطأ المتجر أو الناقل. بعد التحقق وفق السياسة والحقوق يُرد المستحق لوسيلة الدفع الأصلية إن أتيح، والتحقق ليس رفضًا مطلقًا.</p><p>يُقدَّم طلب الاسترجاع عبر نموذج الرسالة في صفحة «تواصل معنا»، مع رقم الطلب ووصف الحالة، وصور الكيس والملصق إن تيسّرت. وبعد استلام الطلب يُراجع وفق هذه السياسة والحقوق النظامية، ثم يُبلَّغ المشتري بنتيجة المعالجة.</p><p>يُطلب البلاغ فور اكتشاف المشكلة. ولا يُسقط مجرد تأخر البلاغ حق العيب أو الخطأ، مع مراعاة المدد والأحكام النظامية ذات العلاقة.</p><p>وفق المادة الرابعة عشرة، ما لم يُتفق على مدة أخرى للتسليم، يحق للمستهلك فسخ العقد إذا تأخر التسليم أو التنفيذ مدة تزيد على خمسة عشر يومًا من تاريخ إبرام العقد أو عن الموعد المتفق عليه، وله استرداد ما دفعه وما ترتب على التأخير، ما لم يكن التأخير بسبب قوة قاهرة. ويلتزم المتجر بإبلاغ المستهلك عند توقع تأخير، أو عند ظهور صعوبات ذات تأثير جوهري في التسليم أو التنفيذ.</p>
