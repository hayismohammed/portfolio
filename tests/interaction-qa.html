<!doctype html>
<html lang="en">
  <meta name="robots" content="noindex,nofollow" />
  <meta charset="utf-8" />
  <title>Portfolio interaction regression checks</title>
  <style>
    body {
      font: 16px system-ui;
      margin: 20px;
    }
    iframe {
      width: 390px;
      height: 650px;
      border: 2px solid #174f48;
    }
    button {
      font: inherit;
      padding: 12px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <h1>Portfolio interaction regression checks</h1>
  <p>
    Local QA only. All form values are fictional; no requests are submitted.
  </p>
  <button id="run">Run interaction checks</button>
  <p id="progress" role="status">Ready</p>
  <iframe id="frame" title="Local sample under test"></iframe>
  <pre id="result"></pre>
  <script>
    const frame = document.getElementById("frame");
    const results = [];
    const check = (name, ok, actual) => {
      results.push({ name, passed: Boolean(ok), actual });
      if (!ok) throw new Error(name + ": " + JSON.stringify(actual));
    };
    const load = (path) =>
      new Promise((resolve, reject) => {
        frame.onload = () => resolve(frame.contentDocument);
        frame.onerror = reject;
        frame.src = new URL(".." + path, location.href).href;
      });
    const nextDate = (day) => {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      do {
        d.setDate(d.getDate() + 1);
      } while (d.getDay() !== day);
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0"),
      ].join("-");
    };
    document.getElementById("run").onclick = async () => {
      results.length = 0;
      document.getElementById("run").disabled = true;
      const storageKey = "hayis-portfolio-lamsa-cart-v1";
      const originalCart = localStorage.getItem(storageKey);
      localStorage.removeItem(storageKey);
      try {
        document.getElementById("progress").textContent = "Testing portfolio navigation";
        let home = await load("/index.html");
        const menu = home.querySelector('.menu-toggle');
        const nav = home.getElementById('primary-nav');
        check("Mobile navigation starts collapsed", !menu.hidden && nav.hidden, menu.outerHTML);
        menu.click();
        check("Menu opens and announces its state", !nav.hidden && menu.getAttribute('aria-expanded') === 'true', nav.hidden);
        home.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key:'Escape', bubbles:true}));
        check("Escape closes menu and restores focus", nav.hidden && home.activeElement === menu, home.activeElement.outerHTML);
        menu.click();
        nav.querySelector('a[href="#courses"]').click();
        check("Section link closes menu and moves focus", nav.hidden && home.activeElement.id === 'courses', home.activeElement.id);
        check("Six business examples remain", home.querySelectorAll('#samples article.work').length === 6, home.querySelectorAll('#samples article.work').length);
        check("Email is the only contact destination", home.querySelectorAll('#contact a').length === 1 && home.querySelector('#contact a').getAttribute('href') === 'mailto:hayis.mohammed@gmail.com', home.querySelector('#contact a').href);
        check("No personal X or phone link", !home.querySelector('a[href*="x.com/"], a[href^="tel:"]'), true);
        check("Portrait has an accessible name", home.querySelector('.portrait').alt === 'هايس العنزي', home.querySelector('.portrait').alt);
        check("One short copyright", home.querySelectorAll('.site-copyright').length === 1 && home.querySelector('.site-copyright').textContent.trim() === '© 2026 Hayis Alanazi. All rights reserved.', home.querySelector('.site-copyright').textContent);
        let guides = await load('/guides/index.html');
        const guideLink = guides.querySelector('a[download]');
        const guideResponse = await fetch(guideLink.href);
        const guideBytes = new Uint8Array(await guideResponse.arrayBuffer());
        check("Word guide downloads as a real DOCX", guideResponse.ok && guideBytes[0] === 80 && guideBytes[1] === 75 && guideBytes.length > 40000, {status:guideResponse.status,bytes:guideBytes.length});
        check("Guide listing has no update/version fields", !guides.querySelector('article').textContent.match(/تاريخ|إصدار|تحديث/), guides.querySelector('article').textContent);
        document.getElementById("progress").textContent = "Testing store";
        let d = await load("/samples/cosmetics-store/index.html");
        const value = (id) => d.getElementById(id).textContent;
        check(
          "Cart initially empty",
          value("cart-total") === "0",
          value("cart-total"),
        );
        d.querySelector('[data-add="cleanser"]').click();
        d.querySelector('[data-add="hair-oil"]').click();
        check(
          "45 + 55 = 100",
          value("cart-total") === "100" && value("summary-count") === "2",
          value("cart-total"),
        );
        d.querySelector('[data-id="cleanser"][data-action="plus"]').click();
        check(
          "Increase one quantity: 145",
          value("cart-total") === "145" && value("summary-count") === "3",
          value("cart-total"),
        );
        check(
          "Focus stays on edited product",
          d.activeElement.dataset.id === "cleanser",
          d.activeElement.outerHTML,
        );
        d.querySelector('[data-id="cleanser"][data-action="minus"]').click();
        check(
          "Decrease quantity: 100",
          value("cart-total") === "100",
          value("cart-total"),
        );
        d.querySelector('[data-id="hair-oil"][data-action="remove"]').click();
        check(
          "Remove a product: 45",
          value("cart-total") === "45",
          value("cart-total"),
        );
        d.querySelector('[data-id="cleanser"][data-action="remove"]').click();
        check(
          "Remove last product: empty and focus on heading",
          value("cart-total") === "0" &&
            !d.getElementById("empty-cart").hidden &&
            d.activeElement.id === "cart",
          d.activeElement.id,
        );
        d.querySelector('[data-filter="perfume"]').click();
        check(
          "Perfume filter shows two products",
          d.querySelectorAll("[data-category]:not([hidden])").length === 2,
          d.querySelectorAll("[data-category]:not([hidden])").length,
        );
        d.querySelector('[data-filter="all"]').click();
        check(
          "All filter restores eight products",
          d.querySelectorAll("[data-category]:not([hidden])").length === 8,
          d.querySelectorAll("[data-category]:not([hidden])").length,
        );
        d.querySelector('[data-add="cleanser"]').click();
        d = await load("/samples/cosmetics-store/index.html?reload-check");
        check(
          "Cart persists on reload",
          d.getElementById("cart-total").textContent === "45",
          d.getElementById("cart-total").textContent,
        );
        const visibleNames = () =>
          [...d.querySelectorAll("[data-category]:not([hidden]) h3")].map(
            (h) => h.textContent,
          );
        const search = d.getElementById("product-search");
        const input = (value) => {
          search.value = value;
          search.dispatchEvent(
            new frame.contentWindow.Event("input", { bubbles: true }),
          );
        };
        input("عِطْر");
        check(
          "Arabic search ignores diacritics",
          visibleNames().length === 2,
          visibleNames(),
        );
        d.querySelector('[data-filter="perfume"]').click();
        input("عود");
        check(
          "Search combines with category",
          visibleNames().length === 1 && visibleNames()[0] === "عطر عود",
          visibleNames(),
        );
        input("غيرموجود");
        check(
          "Empty results are announced",
          visibleNames().length === 0 &&
            !d.getElementById("no-products").hidden &&
            d.getElementById("product-results").textContent.includes("0 من 8"),
          visibleNames(),
        );
        d.getElementById("reset-products").click();
        check(
          "Reset restores products and search focus",
          visibleNames().length === 8 &&
            d.activeElement.id === "product-search",
          visibleNames(),
        );
        const sort = d.getElementById("product-sort");
        sort.value = "price-asc";
        sort.dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        check(
          "Ascending price order",
          visibleNames()[0] === "مقشر شفاه" && visibleNames()[7] === "عطر عود",
          visibleNames(),
        );
        sort.value = "price-desc";
        sort.dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        check(
          "Descending price order",
          visibleNames()[0] === "عطر عود" && visibleNames()[7] === "مقشر شفاه",
          visibleNames(),
        );
        d.getElementById("reset-products").click();
        check(
          "Original order restored",
          visibleNames()[0] === "غسول وجه لطيف",
          visibleNames(),
        );
        d.getElementById("clear-cart").click();
        check(
          "Clear cart removes saved contents",
          localStorage.getItem(storageKey) === null &&
            d.getElementById("cart-total").textContent === "0" &&
            d.activeElement.id === "cart",
          d.getElementById("cart-total").textContent,
        );
        localStorage.setItem(
          storageKey,
          JSON.stringify([
            { id: "cleanser", quantity: 2 },
            { id: "oud", quantity: -1 },
            { id: "unknown", quantity: 5 },
            { id: "lip", quantity: 1.5 },
          ]),
        );
        d = await load("/samples/cosmetics-store/index.html?invalid-entries");
        check(
          "Saved quantities validated",
          d.getElementById("cart-total").textContent === "90" &&
            d.getElementById("summary-count").textContent === "2",
          d.getElementById("cart-total").textContent,
        );
        localStorage.setItem(storageKey, "invalid json");
        d = await load("/samples/cosmetics-store/index.html?corrupt-cart");
        check(
          "Corrupt saved cart does not break page",
          d.getElementById("cart-total").textContent === "0" &&
            d.getElementById("cart-storage-note").textContent.includes("تعذر"),
          d.getElementById("cart-storage-note").textContent,
        );
        d.querySelector('[data-add="cleanser"]').click();
        check(
          "Cart recovers after corrupt storage",
          d.getElementById("cart-total").textContent === "45" &&
            JSON.parse(localStorage.getItem(storageKey))[0].quantity === 1,
          localStorage.getItem(storageKey),
        );
        document.getElementById("progress").textContent = "Testing clinic";
        d = await load("/samples/clinic/index.html");
        const submit = () => d.querySelector('button[type="submit"]').click();
        submit();
        check(
          "Empty form focuses name",
          d.activeElement.id === "nm",
          d.activeElement.id,
        );
        check(
          "Required fields report errors",
          d.querySelectorAll('[aria-invalid="true"]').length === 4,
          d.querySelectorAll('[aria-invalid="true"]').length,
        );
        d.getElementById("nm").value = "تجربة اختبار";
        d.getElementById("ph").value = "٠٥٠٠٠٠٠٠٠٠";
        d.getElementById("dt").value = nextDate(0);
        d.getElementById("dt").dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        check(
          "Weekday offers all three periods",
          d.getElementById("period").options.length === 4 &&
            d.getElementById("period").textContent.includes("12 إلى 4"),
          d.getElementById("period").textContent,
        );
        d.getElementById("period").value = "morning";
        submit();
        check(
          "Arabic numerals accepted with local success",
          d
            .getElementById("appointment-status")
            .textContent.includes("لم يُرسل شيء"),
          d.getElementById("appointment-status").textContent,
        );
        d.getElementById("period").value = "afternoon";
        submit();
        check(
          "Weekday afternoon accepted",
          d
            .getElementById("appointment-status")
            .textContent.includes("12 إلى 4"),
          d.getElementById("appointment-status").textContent,
        );
        d.getElementById("dt").value = nextDate(5);
        d.getElementById("dt").dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        check(
          "Friday has no selectable periods",
          d.getElementById("period").disabled &&
            d.getElementById("period").options.length === 1,
          d.getElementById("period").textContent,
        );
        submit();
        check(
          "Friday is rejected",
          d.getElementById("dt").getAttribute("aria-invalid") === "true",
          d.getElementById("date-error").textContent,
        );
        d.getElementById("dt").value = nextDate(6);
        d.getElementById("dt").dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        check(
          "Saturday offers 4 to 10 only",
          d.getElementById("period").options.length === 2 &&
            d.getElementById("period").textContent.includes("4 إلى 10"),
          d.getElementById("period").textContent,
        );
        d.getElementById("period").value = "morning";
        submit();
        check(
          "Saturday morning is rejected",
          d.getElementById("period").getAttribute("aria-invalid") === "true",
          d.getElementById("period-error").textContent,
        );
        d.getElementById("period").value = "evening";
        submit();
        check(
          "Saturday evening accepted",
          d.querySelectorAll('[aria-invalid="true"]').length === 0,
          d.getElementById("appointment-status").textContent,
        );
        d.getElementById("dt").value = "2020-01-01";
        d.getElementById("dt").dispatchEvent(
          new frame.contentWindow.Event("change", { bubbles: true }),
        );
        submit();
        check(
          "Past dates rejected and no periods offered",
          d.getElementById("dt").getAttribute("aria-invalid") === "true" &&
            d.getElementById("period").disabled,
          d.getElementById("date-error").textContent,
        );
        document.getElementById("progress").textContent = "Testing restaurant";
        d = await load("/samples/restaurant/index.html");
        check(
          "Initial menu has three dishes",
          d.querySelectorAll("#menu-panel article").length === 3,
          d.querySelectorAll("#menu-panel article").length,
        );
        d.getElementById("menu-tab-3").click();
        check(
          "Beverages tab has two items",
          d.querySelectorAll("#menu-panel article").length === 2 &&
            d.getElementById("menu-panel").textContent.includes("قهوة سعودية"),
          d.getElementById("menu-panel").textContent,
        );
        d.getElementById("menu-tab-3").dispatchEvent(
          new frame.contentWindow.KeyboardEvent("keydown", {
            key: "ArrowLeft",
            bubbles: true,
          }),
        );
        check(
          "RTL left arrow wraps to first tab and focuses it",
          d.activeElement.id === "menu-tab-0" &&
            d.activeElement.getAttribute("aria-selected") === "true",
          d.activeElement.id,
        );
        d.activeElement.dispatchEvent(
          new frame.contentWindow.KeyboardEvent("keydown", {
            key: "End",
            bubbles: true,
          }),
        );
        check(
          "End key selects final tab",
          d.activeElement.id === "menu-tab-3",
          d.activeElement.id,
        );
        document.getElementById("progress").textContent =
          "DONE — " + results.length + " checks passed";
      } catch (error) {
        document.getElementById("progress").textContent =
          "FAILED — " + error.message;
      }
      if (originalCart === null) localStorage.removeItem(storageKey);
      else localStorage.setItem(storageKey, originalCart);
      document.getElementById("result").textContent = JSON.stringify(
        results,
        null,
        2,
      );
      document.getElementById("run").disabled = false;
    };
  </script>
</html>
