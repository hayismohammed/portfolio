<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Portfolio audit QA</title><style>body{margin:0;font:16px system-ui;background:#ddd}header{padding:8px;background:white}iframe{display:block;margin:0 auto;border:0;background:white}pre{white-space:pre-wrap}button,select{min-height:44px}</style><header><label>Page <select id="page"></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><button id="show">Show</button><button id="run">Run touch and error checks</button><span id="progress">Ready</span></header><iframe id="frame" title="Responsive preview" width="390" height="844"></iframe><pre id="result"></pre><script>
const paths=['/portfolio/','/portfolio/guides/','/portfolio/guides/hermex-hermes-windows/','/portfolio/samples/serum-landing/','/portfolio/samples/cosmetics-store/','/portfolio/samples/clinic/','/portfolio/samples/restaurant/','/portfolio/samples/salla-coffee/','/portfolio/samples/product-copy/','/portfolio/samples/short-ad/','/portfolio/samples/voiceover-course/','/portfolio/404.html','/404.html'];
const frame=document.getElementById('frame'),page=document.getElementById('page'),width=document.getElementById('width'),progress=document.getElementById('progress'),out=document.getElementById('result');for(const p of paths)page.add(new Option(p,p));
async function load(p,w=390){frame.width=w;await new Promise((r,j)=>{frame.onload=r;frame.onerror=j;frame.src=p});await frame.contentDocument.fonts.ready;}
document.getElementById('show').onclick=()=>load(page.value,Number(width.value));
document.getElementById('run').onclick=async()=>{const results=[];try{for(const p of paths){progress.textContent=p;await load(p);const d=frame.contentDocument,w=frame.contentWindow;const small=[...d.querySelectorAll('a[href],button,input:not([type=checkbox]):not([type=radio]),select,summary')].filter(e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width&&r.height&&s.visibility!=='hidden'&&(r.width<43.9||r.height<43.9)}).map(e=>({text:e.textContent.trim().slice(0,75),id:e.id,rect:{w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height}}));results.push({page:p,smallTargets:small,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,arabic:d.documentElement.lang==='ar'&&d.documentElement.dir==='rtl',mail:!!d.querySelector('a[href^="mailto:hayis.mohammed@gmail.com"]')});}for(const p of ['/missing-audit','/portfolio/missing-audit/deeper','/portfolio/samples/missing-audit']){const r=await fetch(p);const s=await r.text();results.push({page:p,status:r.status,arabic404:s.includes('الصفحة غير موجودة')});}progress.textContent='DONE';}catch(e){progress.textContent='FAILED '+e;}out.textContent=JSON.stringify(results,null,2);};load(paths[0]);
</script></html>
