<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Local resource checks</title><h1>Local resources</h1><button id="run">Check local resources</button><p id="progress">Ready</p><pre id="result"></pre><script>
const pages=['/portfolio/','/portfolio/about/','/portfolio/ads/','/portfolio/sites/','/portfolio/copy/','/portfolio/guides/','/portfolio/guides/hermex-hermes-windows/','/portfolio/samples/serum-landing/','/portfolio/samples/cosmetics-store/','/portfolio/samples/clinic/','/portfolio/samples/restaurant/','/portfolio/samples/salla-coffee/','/portfolio/samples/product-copy/','/portfolio/samples/short-ad/','/portfolio/samples/naxos-ad/','/portfolio/samples/voiceover-course/','/404.html','/portfolio/404.html'];
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result'),bad=[],urls=new Set(),docs=new Map();try{for(const p of pages){const r=await fetch(p);if(!r.ok)bad.push({url:p,status:r.status});const text=await r.text();const d=new DOMParser().parseFromString(text,'text/html');docs.set(p,d);for(const e of d.querySelectorAll('[href],[src],[poster],[srcset]'))for(const attr of ['href','src','poster','srcset']){const raw=e.getAttribute(attr);if(!raw)continue;for(const val of attr==='srcset'?raw.split(',').map(s=>s.trim().split(/\s+/)[0]):[raw]){const u=new URL(val,location.origin+p);if(u.hostname==='hayismohammed.github.io'||u.hostname==='hayisalanazi.sa'){u.protocol=location.protocol;u.host=location.host;}if(u.origin!==location.origin)continue;urls.add(u.pathname+u.search);}}}const list=[...urls];let i=0;await Promise.all(Array.from({length:6},async()=>{while(i<list.length){const url=list[i++];const r=await fetch(url);if(!r.ok)bad.push({url,status:r.status});if(url.endsWith('.css')){const css=await r.text();for(const m of css.matchAll(/url\(["']?([^"')]+)["']?\)/g)){const u=new URL(m[1],location.origin+url);const q=await fetch(u);if(!q.ok)bad.push({url:u.href,status:q.status});}}}}));for(const [p,d]of docs)for(const a of d.querySelectorAll('a[href]')){const u=new URL(a.getAttribute('href'),location.origin+p);if(u.origin===location.origin&&u.hash){let dest=docs.get(u.pathname);if(dest&&!dest.getElementById(decodeURIComponent(u.hash.slice(1))))bad.push({page:p,anchor:a.getAttribute('href')});}}out.textContent=JSON.stringify({pages:pages.length,resources:list.length,failures:bad},null,2);document.getElementById('progress').textContent='DONE';}catch(e){out.textContent=String(e);document.getElementById('progress').textContent='FAILED';}};
</script></html>
