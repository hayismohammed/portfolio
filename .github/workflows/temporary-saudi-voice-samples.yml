name: Temporary Saudi TTS samples (no site changes)
on:
  push:
    branches:
      - rashed/portfolio-upgrade-2026-11-08
    paths:
      - .github/workflows/temporary-saudi-voice-samples.yml
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install free client and audio validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q gradio_client
      - name: Generate two short Saudi samples from public demo
        run: |
          mkdir -p saudi-samples
          python - <<'PY'
          from gradio_client import Client
          from pathlib import Path
          import json, shutil, subprocess
          text='يا هلا، مع مِداد ترتب يومك وتكتب أفكارك بكل سهولة.'
          client=Client('oddadmix/Nabra-Saudi-Demo')
          print('Available API:', client.view_api())
          result=client.predict(text,1.0,fn_index=0)
          print('Returned type:', type(result), 'count:', len(result))
          def find_path(v):
              if isinstance(v,str) and Path(v).is_file(): return v
              if isinstance(v,dict):
                  for key in ('path','name','url','value'):
                      if key in v:
                          out=find_path(v[key])
                          if out:return out
              if isinstance(v,(list,tuple)):
                  for x in v:
                      out=find_path(x)
                      if out:return out
              return None
          if not isinstance(result,(list,tuple)) or len(result)<2: raise RuntimeError('Expected two audio outputs')
          names=['Nabra-Saudi-82M','Nabra-Saudi-7M']
          checks=[]
          for name,part in zip(names,result[:2]):
              p=find_path(part)
              if not p: raise RuntimeError('No audio file for '+name+': '+repr(part)[:300])
              out=Path('saudi-samples')/(name+'.wav')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(p),'-ar','24000','-ac','1',str(out)],check=True)
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out)]))
              seconds=float(probe['format']['duration'])
              if not 1.0<seconds<18:raise RuntimeError('Unexpected duration '+str(seconds))
              if not any(s.get('codec_type')=='audio' for s in probe['streams']):raise RuntimeError('No audio stream')
              subprocess.run(['ffmpeg','-v','error','-i',str(out),'-f','null','-'],check=True)
              checks.append({'name':name,'duration_seconds':round(seconds,2),'file':out.name})
          Path('saudi-samples/README.txt').write_text('تجربة صوتين سعوديين مستقلين عن فيديو مِداد. لا يضاف أي صوت للموقع قبل موافقة المالك.\\nالنص: '+text+'\\nالمصدر: oddadmix/Nabra-Saudi-Demo على Hugging Face\\nترخيص النموذجين Apache-2.0 وفق بطاقات الناشر، ويسمح بالاستخدام التجاري.\\n'+json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(checks,ensure_ascii=False))
          PY
      - name: Upload audio samples outside the repository
        uses: actions/upload-artifact@v4
        with:
          name: saudi-voice-listening-samples
          path: saudi-samples/
          retention-days: 7
