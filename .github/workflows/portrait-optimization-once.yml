name: One-time optimized portrait derivatives
on:
  push:
    branches:
      - rashed/site-audit-remediation-2026-11-14
    paths:
      - scripts/optimize_portrait.py
      - .github/workflows/portrait-optimization-once.yml
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install 'Pillow==11.3.0'
      - name: Create verified derivatives
        run: python scripts/optimize_portrait.py
      - name: Commit the optimized assets on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/media/hayis-alanazi-480.webp assets/media/hayis-alanazi-640.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized responsive WebP portrait; preserve original"
          git push origin "HEAD:rashed/site-audit-remediation-2026-11-14"
