name: One-time Lighthouse performance audit
on:
  push:
    branches:
      - rashed/performance-seo-profile-2026-11-14
    paths:
      - .github/workflows/lighthouse-audit-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse CLI
        run: npm install --no-save --ignore-scripts lighthouse@13.6.0
      - name: Check Chrome
        run: google-chrome --version
      - name: Audit public pages (mobile and desktop)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lighthouse
          npx lighthouse https://hayismohammed.github.io/portfolio/ --output=json --output-path=/tmp/lighthouse/home-mobile-1.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          npx lighthouse https://hayismohammed.github.io/portfolio/ --output=json --output-path=/tmp/lighthouse/home-mobile-2.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          npx lighthouse https://hayismohammed.github.io/portfolio/samples/salla-coffee/ --output=json --output-path=/tmp/lighthouse/coffee-mobile.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
      - name: Print measured metrics and findings
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import {readFileSync,readdirSync} from 'node:fs';
          for (const name of readdirSync('/tmp/lighthouse').filter(n=>n.endsWith('.json'))) {
            const lhr=JSON.parse(readFileSync('/tmp/lighthouse/'+name,'utf8'));
            const scores=Object.fromEntries(Object.entries(lhr.categories).map(([k,v])=>[k,Math.round((v.score||0)*100)]));
            const keys=['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive'];
            const metrics=Object.fromEntries(keys.map(key=>[key,{value:lhr.audits[key]?.numericValue,display:lhr.audits[key]?.displayValue}]));
            const findings=Object.values(lhr.audits).filter(x=>x.score!==null&&x.score<0.9&&['opportunity','diagnostic','binary','numeric'].includes(x.scoreDisplayMode)).filter(x=>x.id&&!keys.includes(x.id)).map(x=>({id:x.id,title:x.title,score:x.score,savingsMs:x.details?.overallSavingsMs||0,savingsBytes:x.details?.overallSavingsBytes||0})).sort((a,b)=>(b.savingsMs-a.savingsMs)||(b.savingsBytes-a.savingsBytes)).slice(0,12);
            console.log('LIGHTHOUSE_RESULT '+JSON.stringify({name,url:lhr.finalDisplayedUrl,version:lhr.lighthouseVersion,scores,metrics,findings,warnings:lhr.runWarnings}));
            for (const id of ['errors-in-console','long-tasks','bootup-time','mainthread-work-breakdown','largest-contentful-paint-element','lcp-discovery-insight','render-blocking-insight','image-delivery-insight','third-party-summary']) {
              const a=lhr.audits[id];
              if(!a) continue;
              console.log('AUDIT_DETAIL '+JSON.stringify({name,id,title:a.title,score:a.score,numericValue:a.numericValue,description:a.description,items:a.details?.items?.slice(0,8)}).slice(0,5500));
            }
          }
          JAVASCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-2026-11-14
          path: /tmp/lighthouse/*.json
          retention-days: 7
