name: Temporary NAMAA Saudi sample (no site changes)
on:
  push:
    branches:
      - rashed/portfolio-upgrade-2026-11-08
    paths:
      - .github/workflows/temporary-namaa-sample.yml
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install free API client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q gradio_client
      - name: Evaluate NAMAA Saudi public demo
        run: |
          mkdir -p namma-sample
          python - <<'PY'
          from pathlib import Path
          from gradio_client import Client
          import json,subprocess,traceback
          report=[]
          try:
              c=Client('omarelshehy/NAMAA-Saudi-Voice')
              c.view_api()
              candidates=[]
              for idx,endpoint in c.endpoints.items():
                  count=len(getattr(endpoint,'parameters_info',[]))
                  name=getattr(endpoint,'api_name','')
                  report.append(f'Endpoint {idx}: {name}, parameters={count}')
                  if count==6:candidates.append(idx)
              if not candidates:raise RuntimeError('No six-input speech generation endpoint')
              text='يا هلا، مع مِداد ترتب يومك وتكتب أفكارك بكل سهولة.'
              result=c.predict(text,None,0.5,0.8,0,0.5,fn_index=candidates[-1])
              def path(v):
                  if isinstance(v,str) and Path(v).is_file():return v
                  if isinstance(v,dict):
                      for k in ('path','name','value'):
                          if k in v:
                              p=path(v[k])
                              if p:return p
                  if isinstance(v,(list,tuple)):
                      for x in v:
                          p=path(x)
                          if p:return p
                  return None
              src=path(result)
              if not src:raise RuntimeError('No downloadable audio returned: '+repr(result)[:300])
              dest=Path('namma-sample/NAMAA-Saudi-TTS.wav')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',src,'-ac','1','-ar','24000',str(dest)],check=True)
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-of','json',str(dest)]))
              secs=float(probe['format']['duration'])
              if not 1<secs<18:raise RuntimeError('Unexpected duration '+str(secs))
              subprocess.run(['ffmpeg','-v','error','-i',str(dest),'-f','null','-'],check=True)
              report.append('Generated '+dest.name+' duration '+str(secs))
          except Exception as exc:
              report.append('FAILED: '+str(exc))
              report.append(traceback.format_exc()[-1500:])
          Path('namma-sample/result.txt').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Upload independent Saudi model result
        uses: actions/upload-artifact@v4
        with:
          name: namaa-saudi-listening-result
          path: namma-sample/
          retention-days: 7
